services:
  - type: web
    name: openclaw
    runtime: docker
    plan: standard
    dockerCommand: /app/entrypoint.sh
    healthCheckPath: /health
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: CLAUDE_CONFIG_DIR
        value: /data/.claude
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 5
